# ============================================
# FILE: .github/workflows/build.yml
# ============================================
# BUILD DYLIB BẰNG CLANG TRỰC TIẾP
# DÙNG CHO ESIGN IOS

name: Build iOS Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v5

      - name: Build dylib bang clang
        run: |
          echo "=== KIEM TRA FILE ==="
          ls -la
          
          echo "=== TIM SDK iOS ==="
          SDK_PATH=$(find /Applications -name "iPhoneOS.sdk" -type d 2>/dev/null | head -1)
          echo "SDK PATH: $SDK_PATH"
          
          echo "=== BUILD ==="
          clang -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=12.0 \
            -fobjc-arc \
            -Wno-deprecated-declarations \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -o MenuDylib.dylib \
            MenuDylib.m
          
          echo "=== KET QUA ==="
          ls -la MenuDylib.dylib

      - name: Tai file dylib
        uses: actions/upload-artifact@v4
        with:
          name: MenuDylib
          path: |
            **/*.dylib
          if-no-files-found: error
