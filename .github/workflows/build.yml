# ============================================
# FILE: .github/workflows/build.yml
# ============================================
# GIẢI PHÁP TRIỆT ĐỂ: KHÔNG TẢI SDK
# DÙNG SDK CÓ SẴN TRONG MACOS RUNNER
# HOẶC DÙNG CÁCH BUILD TRỰC TIẾP BẰNG CLANG

name: Build iOS Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v5

      - name: Kiem tra workspace
        run: |
          echo "=== DANH SACH FILE ==="
          ls -la
          if [ -f "MenuDylib.m" ]; then
            echo "FILE MenuDylib.m TON TAI"
          else
            echo "FILE MenuDylib.m KHONG TON TAI"
          fi

      - name: Build truc tiep bang clang
        run: |
          echo "=== KIEM TRA CLANG ==="
          which clang
          clang --version
          
          echo "=== KIEM TRA SDK iOS TRONG HE THONG ==="
          ls -la /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>/dev/null || echo "Khong tim thay Xcode"
          
          echo "=== TIM SDK iOS ==="
          find /Applications -name "iPhoneOS*.sdk" -type d 2>/dev/null | head -5
          
          echo "=== BUILD TRUC TIEP BANG CLANG ==="
          cd ${GITHUB_WORKSPACE}
          
          # Tim SDK iOS
          SDK_PATH=$(find /Applications -name "iPhoneOS*.sdk" -type d 2>/dev/null | head -1)
          
          if [ -z "$SDK_PATH" ]; then
            echo "KHONG TIM THAY SDK iOS"
            echo "THU BUILD VOI MACOS SDK"
            clang -dynamiclib \
              -arch arm64 \
              -isysroot $(xcrun --sdk macosx --show-sdk-path) \
              -framework UIKit \
              -framework Foundation \
              -framework ObjectiveC \
              -o MenuDylib.dylib \
              MenuDylib.m
          else
            echo "TIM THAY SDK: $SDK_PATH"
            clang -dynamiclib \
              -arch arm64 \
              -isysroot "$SDK_PATH" \
              -framework UIKit \
              -framework Foundation \
              -framework ObjectiveC \
              -o MenuDylib.dylib \
              MenuDylib.m
          fi
          
          echo "=== KIEM TRA KET QUA BUILD ==="
          ls -la *.dylib 2>/dev/null || echo "KHONG CO FILE DYLIB"

      - name: Tai file dylib
        uses: actions/upload-artifact@v4
        with:
          name: MenuDylib
          path: |
            **/*.dylib
          if-no-files-found: error
