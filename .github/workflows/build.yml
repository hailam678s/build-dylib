name: Build iOS Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup basic tools
        run: |
          set -e
          brew update || true
          brew install make || true

      - name: Install Theos (stable)
        run: |
          set -e

          git clone --recursive https://github.com/theos/theos.git $THEOS

          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

          mkdir -p $THEOS/sdks

          echo "Cloning iOS SDKs..."
          git clone https://github.com/theos/sdks.git $THEOS/sdks-repo || true

          if [ -d "$THEOS/sdks-repo" ]; then
            cp -R $THEOS/sdks-repo/*.sdk $THEOS/sdks/ || true
          fi

          echo "SDK list:"
          ls -la $THEOS/sdks || true

      - name: Prepare project
        run: |
          set -e

          PROJECT=$HOME/project
          mkdir -p $PROJECT/MenuDylib

          cat > $PROJECT/MenuDylib/Makefile << 'EOF'
export ARCHS = arm64
export TARGET = iphone:clang:12.0

include $(THEOS)/makefiles/common.mk

LIBRARY_NAME = MenuDylib
MenuDylib_FILES = MenuDylib.m
MenuDylib_FRAMEWORKS = UIKit Foundation
MenuDylib_LDFLAGS = -dynamiclib

include $(THEOS_MAKE_PATH)/library.mk
EOF

          if [ -f "$GITHUB_WORKSPACE/MenuDylib.m" ]; then
            cp $GITHUB_WORKSPACE/MenuDylib.m $PROJECT/MenuDylib/
          else
            echo "Missing MenuDylib.m"
            exit 1
          fi

      - name: Build dylib (DO NOT STOP PIPELINE)
        id: build
        continue-on-error: true
        run: |
          set +e

          cd $HOME/project/MenuDylib

          make package || echo "BUILD FAILED"

          echo "Searching output..."
          find $HOME -name "*.dylib" || true

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MenuDylib
          path: |
            **/*.dylib
          if-no-files-found: warn
