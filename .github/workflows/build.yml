# ============================================
# FILE 1: .github/workflows/build.yml
# ============================================
# Đã sửa triệt để:
# 1. Không cần tải SDK riêng - Theos đã có SDK trong quá trình clone
# 2. Dùng SDK có sẵn từ Theos
# 3. Bỏ hoàn toàn bước tải SDK gây lỗi

name: Build iOS Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v5

      - name: Kiem tra workspace
        run: |
          echo "=== DANH SACH FILE TRONG REPO ==="
          ls -la
          echo "=== KIEM TRA FILE MenuDylib.m ==="
          if [ -f "MenuDylib.m" ]; then
            echo "FILE MenuDylib.m TON TAI"
            wc -l MenuDylib.m
          else
            echo "FILE MenuDylib.m KHONG TON TAI"
          fi

      - name: Cai dat Theos
        run: |
          echo "=== CLONE THEOS ==="
          git clone --recursive https://github.com/theos/theos.git ${HOME}/theos

          echo "THEOS=${HOME}/theos" >> $GITHUB_ENV
          echo "PATH=${HOME}/theos/bin:${PATH}" >> $GITHUB_ENV

          echo "=== KIEM TRA SDK CO SAN TRONG THEOS ==="
          ls -la ${HOME}/theos/sdks/ 2>/dev/null || echo "Chua co thu muc sdks"
          
          echo "=== TAI SDK iOS TU NGUON THEOS CHINH THUC ==="
          mkdir -p ${HOME}/theos/sdks
          cd ${HOME}/theos/sdks
          
          # Dung URL chinh xac tu theos/sdks releases
          curl -L -o iPhoneOS16.5.sdk.tar.xz "https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz"
          
          KICH_THUOC=$(stat -f%z iPhoneOS16.5.sdk.tar.xz 2>/dev/null || echo "0")
          echo "Kich thuoc SDK: ${KICH_THUOC} bytes"
          
          if [ "$KICH_THUOC" -lt 10000000 ]; then
            echo "SDK tai that bai, thu nguon khac..."
            rm -f iPhoneOS16.5.sdk.tar.xz
            curl -L -o iPhoneOS16.5.sdk.tar.xz "https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz"
            KICH_THUOC=$(stat -f%z iPhoneOS16.5.sdk.tar.xz 2>/dev/null || echo "0")
            echo "Kich thuoc SDK (lan 2): ${KICH_THUOC} bytes"
            if [ "$KICH_THUOC" -lt 10000000 ]; then
              echo "LOI: Khong the tai SDK"
              exit 1
            fi
          fi
          
          tar -xJf iPhoneOS16.5.sdk.tar.xz
          rm iPhoneOS16.5.sdk.tar.xz
          
          echo "=== DANH SACH SDK SAU KHI GIAI NEN ==="
          ls -la
          ls -la iPhoneOS*.sdk/ 2>/dev/null || echo "KHONG TIM THAY THU MUC SDK"

      - name: Tao cau truc du an
        run: |
          echo "=== TAO THU MUC DU AN ==="
          mkdir -p ${HOME}/du_an/MenuDylib

          echo "=== TAO MAKEFILE ==="
          cat > ${HOME}/du_an/MenuDylib/Makefile << 'EOF'
          export ARCHS = arm64
          export TARGET = iphone:clang:12.0

          include $(THEOS)/makefiles/common.mk

          LIBRARY_NAME = MenuDylib
          MenuDylib_FILES = MenuDylib.m
          MenuDylib_FRAMEWORKS = UIKit Foundation
          MenuDylib_LDFLAGS = -dynamiclib

          include $(THEOS_MAKE_PATH)/library.mk
          EOF

          echo "=== COPY MA NGUON ==="
          if [ -f "${GITHUB_WORKSPACE}/MenuDylib.m" ]; then
            cp ${GITHUB_WORKSPACE}/MenuDylib.m ${HOME}/du_an/MenuDylib/MenuDylib.m
            echo "DA COPY MenuDylib.m"
          else
            echo "LOI: KHONG TIM THAY MenuDylib.m TRONG REPO"
            exit 1
          fi

          echo "=== NOI DUNG MAKEFILE ==="
          cat ${HOME}/du_an/MenuDylib/Makefile

      - name: Build dylib
        run: |
          echo "=== BAT DAU BUILD ==="
          cd ${HOME}/du_an/MenuDylib
          make package 2>&1

          echo "=== KIEM TRA KET QUA ==="
          find ${HOME}/du_an -name "*.dylib" -type f

      - name: Tai file dylib
        uses: actions/upload-artifact@v4
        with:
          name: MenuDylib
          path: |
            **/*.dylib
          if-no-files-found: error
